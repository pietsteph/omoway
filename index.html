<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:type" content="website">
  <meta property="og:title" content="OMOWAY ACCESSORIES by Piet">
  <meta property="og:description" content="Temukan aksesoris untuk OMO X kesayanganmu!">
  <meta property="og:url" content="https://pietsteph.github.io/">
  <meta property="og:image" content="https://pietsteph.github.io/omoway/logo.png">
  <meta property="og:image:width" content="630">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="logo.png">
  <title>OMOWAY ACCESSORIES</title>
  <style>
    :root{--oranye:#ee4d2d;--teks:#fff;--abu:#6b6b6b;--bg:#000;--garis:#fff;--accent:#f3c694}
    *{box-sizing:border-box}
    body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--teks);background:var(--bg)}
    .top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 5vw;background:#fff;border-bottom:1px solid var(--accent);background: var(--bg);}
    .top h1{margin:0;font-size:1.25rem;color:var(--accent)}
    .cari{display:flex;gap:8px;flex-wrap:wrap}
    input{font:inherit;padding:8px 12px;border:1px solid var(--garis);border-radius:6px;background:#fff}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .layout{display:flex;flex-direction: column;gap:20px;align-items:flex-start;padding:20px 5vw}
    .grid{flex:1;min-width:0;width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
    /* .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:20px 5vw} */
    .kategori{display:flex;flex-direction:row;gap:6px;flex-wrap: wrap}
    .kategori[hidden]{display:none}
    .kat-item{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;font:inherit;font-size:.9rem;border:1px solid var(--garis);border-radius:10px;background:#fff;color:var(--bg);cursor:pointer}
    .kat-item:hover{border-color:var(--accent)}
    .kat-item.aktif{background:var(--accent);border-color:var(--accent)}
    .jml{font-size:.75rem;font-weight:700;padding:0 8px;border-radius:999px;background:var(--bg);color:var(--teks)}
    .kat-item.aktif .jml{background:rgba(255,255,255,.25);color:#000}
    @media (max-width:760px){
      .layout{flex-direction:column;align-items:stretch}
      .kategori{flex-direction:row;width:auto;position:static;overflow-x:auto;padding-bottom:4px;flex-wrap:nowrap}
      .kat-item{width:auto;flex:none;white-space:nowrap}
    }
    .kartu{background:#fff;border:1px solid var(--garis);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
    .brand, .sub{color:var(--abu);line-height:1.3}
    .brand{margin:-7px 0 0;font-size:.88rem}
    .sub{margin:0px 0 0;font-size:.8rem}
    .thumb{position:relative}
    .badge{position:absolute;top:8px;left:8px;padding:2px 10px;border-radius:4px;font-size:.72rem;font-weight:700;letter-spacing:.03em;color:#fff}
    .badge.NEW{background:#1d6fd8}
    .badge.HOT{background:#d62828}
    .badge.RECOMMENDED{background:#1a8a4a}
    .kartu img,.noimg{width:100%;aspect-ratio:1;object-fit:cover;background:#eee}
    .isi{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1;color:#000000}
    .isi h2{margin:0;font-size:.95rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
    .harga{margin:0;color:var(--oranye);font-weight:700}
    .beli{margin-top:auto;text-align:center;padding:8px;border-radius:6px;background:var(--oranye);color:#fff;text-decoration:none}
    .pesan{grid-column:1/-1;color:var(--teks)}
    footer{padding:20px 5vw;color:var(--teks);font-size:.85rem}
  </style>
</head>
<body>
  <header class="top">
    <h1 id="judul">OMOWAY ACCESSORIES</h1>
    <div class="cari">
      <input id="q" placeholder="Cari produk" aria-label="Cari produk">
    </div>
  </header>
  <div class="layout">
    <nav class="kategori" id="kategori" aria-label="Kategori" hidden></nav>
    <main class="grid" id="grid"><p class="pesan">Memuat produk...</p></main>
  </div>
  <footer>Link di situs ini adalah link afiliasi. Kami bisa mendapat komisi dari pembelian, tanpa biaya tambahan untuk kamu.</footer>

  <script>
    const SHEET_ID = '1-IF1MVZGs5MwSxmprKfdwUVTUUJ253yPkdTrL0Wd8Uk'; // bagian di antara /d/ dan /edit pada URL Google Sheet
    const SHEET_NAME = 'Produk';
    const API = 'https://script.google.com/a/~/macros/s/AKfycbwsTuMiMuD6Lxc3ykhH-XWhKqti_T6miEROqvWm0ofaO2IA0OlA5Cj4eok6qXxbfKapiA/exec';
    let semua = [];
    const grid = document.getElementById('grid');
    const q = document.getElementById('q');
    const navKat = document.getElementById('kategori');
    let aktifKat = '';

    function el(tag, props, children) {
      const e = document.createElement(tag);
      Object.assign(e, props || {});
      (children || []).forEach(c => e.appendChild(c));
      return e;
    }

    // Daftar kategori vertikal + jumlah produk per kategori; klik lagi untuk kembali ke "Semua"
    function renderKategori() {
      const hitung = {};
      semua.forEach(p => { if (p.kategori) hitung[p.kategori] = (hitung[p.kategori] || 0) + 1; });
      const daftar = Object.keys(hitung).sort((a, b) => hitung[b] - hitung[a] || a.localeCompare(b, 'id'));
      navKat.replaceChildren();
      if (!daftar.length) { navKat.hidden = true; return; }
      navKat.hidden = false;
      [['', 'Semua', semua.length]].concat(daftar.map(k => [k, k, hitung[k]])).forEach(([nilai, label, jml]) => {
        const b = el('button', { type: 'button', className: 'kat-item' + (aktifKat === nilai ? ' aktif' : '') }, [
          el('span', { textContent: label }),
          el('span', { className: 'jml', textContent: String(jml) })
        ]);
        b.setAttribute('aria-pressed', aktifKat === nilai ? 'true' : 'false');
        b.addEventListener('click', () => { aktifKat = (aktifKat === nilai) ? '' : nilai; renderKategori(); tampil(); });
        navKat.appendChild(b);
      });
    }

    function tampil() {
      const kata = q.value.trim().toLowerCase();
      const hasil = semua.filter(p =>
        (!kata || (p.nama + ' ' + p.brand + ' ' + p.subjudul).toLowerCase().includes(kata)) && (!aktifKat || p.kategori === aktifKat));
      grid.replaceChildren();
      if (!hasil.length) { grid.appendChild(el('p', { className: 'pesan', textContent: 'Belum ada produk yang cocok.' })); return; }
      hasil.forEach(p => {
        const gambar = /^https?:\/\//i.test(p.gambar)
          ? el('img', { src: p.gambar, alt: p.nama, loading: 'lazy', referrerPolicy: 'no-referrer' })
          : el('div', { className: 'noimg' });
        const thumb = el('div', { className: 'thumb' }, [gambar]);
        if (p.badge) thumb.appendChild(el('span', { className: 'badge ' + p.badge, textContent: p.badge }));
        const isi = [el('h2', { textContent: p.nama })];
        isi.push(el('p', { className: 'brand', textContent: p.brand ? p.brand : 'No brand' }));
        if (p.subtitle) isi.push(el('p', { className: 'sub', textContent: p.subtitle }));
        const beli = el('a', { className: 'beli', href: p.link, target: '_blank', rel: 'nofollow sponsored noopener', textContent: 'Dapatkan Sekarang' });
        beli.addEventListener('click', () => fetch(API + '?aksi=klik&id=' + p.id, { mode: 'no-cors', keepalive: true }).catch(() => {}));
        isi.push(beli);
        grid.appendChild(el('article', { className: 'kartu' }, [thumb, el('div', { className: 'isi' }, isi)]));
      });
    }

    // fetch(API + '?aksi=produk')
    //   .then(r => r.json())
    //   .then(data => {
    //     semua = data.produk;
    //     if (data.nama) { document.getElementById('judul').textContent = data.nama; document.title = data.nama; }
    //     renderKategori();
    //     tampil();
    //   })
    //   .catch(() => { grid.replaceChildren(el('p', { className: 'pesan', textContent: 'Produk gagal dimuat. Coba muat ulang halaman.' })); });

    // Data dibaca langsung dari Google Sheets lewat endpoint gviz (dimuat via tag <script>, tanpa CORS)
    function muatSheet() {
      return new Promise((ok, gagal) => {
        const fn = 'gv_' + Date.now() + Math.floor(Math.random() * 1e6);
        const s = document.createElement('script');
        const bersih = () => { clearTimeout(t); delete window[fn]; s.remove(); };
        const t = setTimeout(() => { bersih(); gagal(new Error('timeout')); }, 12000);
        window[fn] = d => { bersih(); if (d && d.status === 'ok') ok(d.table); else gagal(new Error('status gviz bukan ok')); };
        s.onerror = () => { bersih(); gagal(new Error('gagal memuat')); };
        s.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?sheet=' + encodeURIComponent(SHEET_NAME) +
                '&headers=1&tqx=out:json;responseHandler:' + fn;
        document.head.appendChild(s);
      });
    }

    // Ubah tabel gviz jadi daftar produk. Kolom dicari dari nama header, jadi urutan kolom bebas.
    function ubahTabel(tabel) {
      const label = tabel.cols.map(c => String(c.label || '').trim().toLowerCase());
      const idx = (nama, cadangan) => { const i = label.indexOf(nama); return i >= 0 ? i : cadangan; };
      const cNama = idx('nama', 0), cBrand = idx('brand', 1), cSub = idx('subtitle', 2), cLink = idx('link', 3);
      const cGambar = idx('gambar', 4), cKategori = idx('kategori', 5), cBadge = idx('badge', 7);
      const nilai = (baris, i) => { const c = baris.c[i]; return c && c.v != null ? String(c.v).trim() : ''; };
      return tabel.rows.map((r, i) => {
        const badge = nilai(r, cBadge).toUpperCase();
        return {
          id: i + 2,
          nama: nilai(r, cNama),
          brand: String(r[cBrand] || ''),
          subtitle: String(r[cSub] || '').trim(),
          link: nilai(r, cLink),
          gambar: nilai(r, cGambar),
          kategori: nilai(r, cKategori),
          subjudul: nilai(r, cSub),
          badge: badge };
      }).filter(p => p.nama && /^https?:\/\//i.test(p.link)).reverse();
    }

    function cobaMuat(sisa) {
      return muatSheet().catch(err => {
        if (sisa <= 0) throw err;
        return new Promise(r => setTimeout(r, 1500)).then(() => cobaMuat(sisa - 1));
      });
    }
    cobaMuat(2)
      .then(tabel => { semua = ubahTabel(tabel); renderKategori(); tampil(); })
      .catch(err => {
        console.warn('Gagal memuat sheet:', err.message, '- pastikan sheet dibagikan: siapa saja yang punya link dapat melihat');
        grid.replaceChildren(el('p', { className: 'pesan', textContent: 'Produk gagal dimuat. Coba muat ulang halaman.' }));
      });

    q.addEventListener('input', tampil);
  </script>
</body>
</html>
